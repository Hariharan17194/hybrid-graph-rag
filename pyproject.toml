# hybrid-graph-rag variant: code lives in backend/, so tests import from there.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]
extend-exclude = [".venv", "venv", "backend/storage", "backend/uploads"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"backend/rag_pipeline.py" = ["S301"]   # pickle only loads our own graph file from local storage

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"
