# Lint → test → secret-scan → (optional) Docker build. Runs on every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check --output-format=github"
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check --diff"

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Prefer a lightweight dev requirements file; fall back to the runtime one.
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then pip install -r requirements.txt pytest
          else pip install pytest; fi
      - name: Run pytest
        run: |
          set +e
          pytest -q
          code=$?
          # exit code 5 = "no tests collected" — don't fail repos that have no tests yet
          if [ $code -eq 5 ]; then echo "::warning::No tests found — add some in tests/"; exit 0; fi
          exit $code

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - name: Build images (only if a compose file exists)
        run: |
          if [ -f docker-compose.yml ] || [ -f compose.yaml ]; then
            [ -f backend/.env.example ] && [ ! -f backend/.env ] && cp backend/.env.example backend/.env
            [ -f .env.example ] && [ ! -f .env ] && cp .env.example .env
            docker compose build
          else
            echo "No compose file — skipping."
          fi
