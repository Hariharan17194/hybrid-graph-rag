name: 🐞 Bug report
description: Something isn't working as expected
title: "fix: <short description>"
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this! Please **never paste API keys** into an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `docker compose up`
        2. Upload `file.pdf`
        3. Ask "…"
    validations: { required: true }
  - type: dropdown
    id: provider
    attributes:
      label: LLM provider
      options: [Ollama, OpenAI, Anthropic, Not applicable]
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Windows 11 · Python 3.11 · Docker 27"
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
